name: e2e
# END-TO-END FLOW TESTS — runs the simulators' LIVE layers (seed → run → assert → cleanup) against a
# real Supabase database. These are skipped in the per-push `guards` workflow (no DB there); here they
# execute the full business-process journey for real when the SUPABASE secrets are configured.
#
# Triggers: nightly + manual (these are DB-heavy, so not on every push). Without the secrets the
# simulators skip their live layer gracefully and the run still passes (safe for forks).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC nightly

jobs:
  e2e-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `npm run type-check` (tsc --noEmit) on this app peaks above the default
      # ~4 GB Node heap and OOM-crashes (exit 134, "Reached heap limit"). This
      # job runs the IDENTICAL type-check as the guards workflow, so it must
      # carry the identical heap — 8192 stopped being enough once the program
      # measured 8.45 GB and guards died with exit 134. Kept in lockstep with
      # guards.yml deliberately: the two drifting apart is how one workflow goes
      # green while the other OOMs on the same commit.
      NODE_OPTIONS: --max-old-space-size=12288
      # Provided via repo Secrets; empty → simulators skip the live layer (still exit 0).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Run end-to-end business-process flows (live DB seed/assert/cleanup)
        run: npm run test:e2e:flows
      # LIVE-SCHEMA DRIFT (round 18): the per-push drift guard proves code vs
      # the COMMITTED snapshot; this proves the snapshot vs the LIVE database —
      # DDL applied between deploys is caught within a day, not by a customer.
      # Creds-gated: skips exit-0 without secrets.
      - name: Live-schema drift check (committed snapshot vs live DDL)
        run: npx tsx scripts/check-live-schema-drift.ts
      # The FULL guard chain against main nightly — per-push runs cover PRs;
      # this catches anything that landed on main between deploys.
      - name: Full guard chain
        run: npm run guard

# The production BUILD GATE — the check that was missing.
#
# The guards workflow runs typecheck + the simulator chain, and e2e runs the
# lifecycle harness, but nothing ran `next build` — so a compile-only failure
# (RSC/client-boundary violation, invalid route-segment config, a page that
# throws during static generation) would only ever surface at deploy time on
# Vercel. This workflow makes `next build` a first-class PR gate.
#
# Env: placeholder, non-secret values so module factories that throw on a
# genuinely-missing var (the Supabase clients) don't false-fail static
# generation. The build validates COMPILE + BOUNDARIES + PRERENDER — the layer
# tsc can't see. Real credentials are never needed to prove the app builds.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Do NOT cancel an in-flight build when a new commit lands: a webpack build of
  # this app takes several minutes, and cancel-in-progress surfaced the canceled
  # run as "the runner received a shutdown signal" — indistinguishable from an
  # OOM at a glance. Let each build finish so its result is trustworthy.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Single-process webpack build (no build worker) AND single-worker page-data
      # collection (experimental.cpus:1 — see next.config.ts).
      #
      # This value is EMPIRICALLY BRACKETED, not guessed. `next build` runs two
      # phases with materially different memory profiles and only ONE NODE_OPTIONS
      # between them, because page-data collection is a child process that inherits
      # it. Every number below is from a CI log on this branch:
      #
      #   12288, 3 workers (os.cpus()-1 default)
      #       → runner shutdown 19-73s into page-data collection
      #   12288, cpus:1
      #       → compile OK in 8.4-9.2 min; "Collecting page data using 1 worker";
      #         survived 3m10s, then runner shutdown. RSS, not heap: the cap is
      #         old space only, and new space + code + native add ~2-4 GB on a
      #         graph this size, so a 12 GB cap lets one process approach the
      #         16 GB runner ceiling.
      #    8192, cpus:1
      #       → COMPILE ITSELF aborted at 6 min, exit 134 (SIGABRT),
      #         "Ineffective mark-compacts near heap limit", heap at
      #         7161 MB used / 7773 MB committed. Too low: this broke a phase
      #         that had been working.
      #
      # So compile demonstrably needs >7.8 GB, and page-data demonstrably cannot
      # be given 12 GB on a 16 GB runner. 10240 is the value that clears compile's
      # measured demand with ~2.4 GB of margin while staying meaningfully under the
      # ceiling that made page-data's RSS fatal.
      #
      # If this is still killed, the phases genuinely do not fit one runner and the
      # answer is a larger runner — a cost decision for the repo owner, not
      # something to keep bisecting here.
      NODE_OPTIONS: "--max-old-space-size=10240"
      # NO max-old-space-size override: `next build` uses Turbopack (Rust), which
      # holds the heavy compile state in NATIVE memory. Reserving a large V8 old
      # space steals from that native budget and pushed total RSS past the 16 GB
      # GitHub-hosted runner ceiling — the runner was killed ("shutdown signal")
      # ~4.5 min into compile. Letting V8 self-manage leaves room for Turbopack.
      # Placeholder build-time env — presence, not real secrets. Overridden by
      # repository/environment secrets when those are configured.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiJ9.placeholder.placeholder' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiJ9.placeholder.placeholder' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://app.example.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'placeholder-cron-secret' }}
    steps:
      - uses: actions/checkout@v4
      # Node + `npm ci` live in ONE composite action for all four workflows —
      # see .github/actions/node-deps/action.yml.
      - uses: ./.github/actions/node-deps
      - name: Production build (next build)
        run: npm run build

  # ── LEVER (d): THE TWO-HALF COMPILE MATRIX (wave 148, lane 148A) — read the 2026-11-01 entry in the
  # bracket above. A CI-ONLY gate: each half's .next is thrown away with its runner. The globs are the ONE

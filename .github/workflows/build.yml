      DEBUG: "next:build:webpack-build*"
      # Placeholder build-time env — presence, not real secrets. Overridden by
      # repository/environment secrets when those are configured.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiJ9.placeholder.placeholder' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiJ9.placeholder.placeholder' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://app.example.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'placeholder-cron-secret' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-deps
      - name: Preflight — the half heap fits ubuntu-latest
        run: |
          HEAP="${{ vars.BUILD_HALF_HEAP_MB || '14336' }}"
          echo "half '${{ matrix.half }}' — globs: ${{ matrix.paths }} — compile heap ${HEAP} MB, generate heap ${{ vars.BUILD_GENERATE_HEAP_MB || '10240' }} MB"
          if [ "$HEAP" -gt 14336 ]; then
            echo "::error::BUILD_HALF_HEAP_MB=${HEAP} exceeds 14336 on a 16 GB runner — the off-heap RSS that made 12288 fatal before the split would kill the machine. Configure BUILD_RUNNER for a larger runner instead."
            exit 1
          fi
      - uses: ./.github/actions/next-build-phases
        with:
          debug-build-paths: ${{ matrix.paths }}
          generate-heap-mb: ${{ vars.BUILD_GENERATE_HEAP_MB || '10240' }}

  # ── THE ONE VERDICT. Fail closed: certified only by a path that actually ran and succeeded.
  next-build:
    needs: [next-build-full, next-build-half]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict — the full pass, or every half, succeeded
        run: |
          FULL_RESULT="${{ needs.next-build-full.result }}"
          HALF_RESULT="${{ needs.next-build-half.result }}"
          echo "full single pass: ${FULL_RESULT} · two-half matrix: ${HALF_RESULT}"
          if [ "$FULL_RESULT" = "success" ]; then
            echo "CERTIFIED — the full single pass compiled and generated the whole tree on runner '${{ vars.BUILD_RUNNER }}'."
            exit 0
          fi
          if [ "$FULL_RESULT" = "skipped" ] && [ "$HALF_RESULT" = "success" ]; then
            echo "CERTIFIED (lever d) — every app/ page and route compiled and generated in exactly one of two halves on ubuntu-latest."
            echo "NOT PROVEN by this path: a deployable .next, the whole graph fitting one compile (Vercel's single pass — needs the owner's build machine), cross-half manifests. See build.yml's 2026-11-01 entry."
            exit 0
          fi
          echo "::error::NOT CERTIFIED — full=${FULL_RESULT}, halves=${HALF_RESULT}. A skipped or cancelled build is never a green build."
          exit 1

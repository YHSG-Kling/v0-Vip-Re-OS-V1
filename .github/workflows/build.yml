        run: |
          HEAP="${{ vars.BUILD_HEAP_MB || '14336' }}"
          TOTAL_MB=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          echo "runner '${{ vars.BUILD_RUNNER }}': ${TOTAL_MB} MB RAM; compile heap ${HEAP} MB; generate heap ${{ vars.BUILD_GENERATE_HEAP_MB || '10240' }} MB"

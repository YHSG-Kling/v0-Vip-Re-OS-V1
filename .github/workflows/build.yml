    if: ${{ vars.BUILD_RUNNER == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - half: dashboard
            paths: "app/dashboard/**"
          - half: rest
            paths: "app/**,!app/dashboard/**"
    name: next-build-half (${{ matrix.half }})
    env:

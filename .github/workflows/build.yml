      # The same cap as the full pass on this runner (14336, the bracket's last measured step); a half compiles
      # ~68% of the first-party graph, so it is expected to sit well under the ~90% give-up line. BUILD_HALF_HEAP_MB
      # may LOWER it; the preflight refuses raising it on a 16 GB runner (page-data / off-heap RSS, above).

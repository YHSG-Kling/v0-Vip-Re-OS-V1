# Egress integrity harness — the schema/coordination/governance contract, enforced.
#
# Ratcheted: schema-drift baseline is 0, so ANY new phantom-column reference fails here.
# This is what makes the egress "harnessed" — the guards that were manual now block merge.
#
# Blocking gates (all proven green):
#   · type-check        — no TS errors
#   · schema-drift      — no code references a column the live table lacks (baseline 0)
#   · signal-integrity  — every inter-manager signal_type is catalogued + has a real consumer
#   · egress-coverage   — every governed deliverable maps to an owning manager queue
#   · egress-scope      — egress scoping rules hold
#   · voice-coverage    — voice admin tool registry is complete
#   · manager-signals   — the bus publish/consume contract
#   · manager-ownership — every live-snapshot table maps to an accountable manager (zero orphans)
#   · command-center    — the aggregator loads cleanly
name: guards

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  egress-guards:
    runs-on: ubuntu-latest
    # 2026-09-11: 20 minutes was the cap while `npm run guard` ran ~16 min on
    # this runner (run 34548154361 at 844546ce: 16m12s, green). Waves 55-56 added
    # test:ai-callback-loop, test:dead-imports, test:anchor-census,
    # test:children-census and test:import-export-parity plus the simulator
    # sweep's growth, and runs 34562243590 / 34562249006 / 34622268553 /
    # 34622276787 were all CANCELLED by this timeout at 19m30s-20m20s inside
    # "Run egress integrity guards" — not a red proof (the same chain is green
    # locally, GUARD_EXIT=0, at 26c2c9e4). 40 leaves headroom for the chain to
    # keep growing without turning a slow runner into a false red.
    timeout-minutes: 40
    env:
      # tsc + the simulators need more than Node's default ~4GB heap on this large
      # codebase. 8192 was enough until the program outgrew it: `tsc --noEmit
      # --extendedDiagnostics` now reports "Memory used: 8450371K" — 8.45 GB, just
      # past the 8 GB cap — and the job died with exit 134, "Ineffective
      # mark-compacts near heap limit". It passes locally only because a dev box
      # has more headroom, which is exactly how this stays invisible until CI.
      #
      # Measured before choosing the number, not guessed: excluding all 643
      # scripts/ files from the program saves only ~540 MB (8450 MB → 7911 MB),
      # so the simulators are NOT the driver and splitting the program would add
      # a second tsconfig for a 6% win while still sitting at the edge. The app
      # graph itself is ~7.9 GB. 10240 is the value build.yml already runs on the
      # same ubuntu-latest runner (16 GB), so it is proven rather than hopeful,
      # and it leaves ~21% headroom over today's peak.
      #
      # This raises the ceiling; it does not shrink the graph. When the peak
      # approaches 10 GB the answer is project references, not another bump.
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
      # Node + `npm ci` live in ONE composite action for all four workflows —
      # see .github/actions/node-deps/action.yml for why the ffmpeg-static
      # postinstall no longer sits on the critical path of every check.
      - uses: ./.github/actions/node-deps
      - name: Run egress integrity guards
        run: npm run guard
      - name: Run compliance / consent guards
        run: npm run guard:compliance
